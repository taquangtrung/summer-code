# `[workspace]` detaches this fixture from the summer-code workspace above it.
# Without it, `cargo test` inside a copied fixture fails with "current package
# believes it's in a workspace when it's not", and every run of the task scores
# a failure that says nothing about the agent.
[workspace]

[package]
name = "greet"
version = "0.1.0"
edition = "2021"
